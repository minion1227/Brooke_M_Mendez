# Netlify picks this up automatically when the repo is imported, so the build
# settings never have to be typed into the dashboard.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Astro 5 needs Node 18+; pin so a future default change can't break the build.
  NODE_VERSION = "20"

# Hashed assets are immutable — cache them hard.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The HTML must revalidate, otherwise edits stay invisible behind a stale cache.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    # Basic hardening. No frames, no MIME sniffing, no referrer leakage to
    # third parties, and no access to camera/mic/location — none are used.
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
